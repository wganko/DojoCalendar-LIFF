<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>尺八道場 カレンダー登録</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 16px;
            background: #eef1f6;
            color: #1a2a4a;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN", "Noto Sans JP", Meiryo, sans-serif;
            font-size: 16px;
            line-height: 1.7;
            -webkit-text-size-adjust: 100%;
        }

        .wrap {
            max-width: 560px;
            margin: 0 auto;
        }

        .card {
            background: #ffffff;
            border-top: 4px solid #d4af37;
            border-radius: 12px;
            box-shadow: 0 2px 10px rgba(26, 42, 74, 0.12);
            padding: 20px 18px;
            margin-bottom: 16px;
        }

        h1 {
            margin: 0 0 16px;
            font-size: 20px;
            line-height: 1.5;
            color: #1a2a4a;
        }

        h2 {
            margin: 0 0 10px;
            font-size: 17px;
            color: #1a2a4a;
        }

        p {
            margin: 0 0 12px;
        }

        .url {
            display: block;
            background: #f5f7fa;
            border: 1px solid #d7dde8;
            border-radius: 8px;
            padding: 12px;
            font-size: 16px;
            color: #1a2a4a;
            word-break: break-all;
            overflow-wrap: anywhere;
        }

        .btn {
            display: block;
            width: 100%;
            min-height: 48px;
            line-height: 1.3;
            padding: 12px 16px;
            margin: 12px 0 0;
            background: #1a2a4a;
            border: 2px solid #d4af37;
            border-radius: 10px;
            color: #ffffff;
            font-size: 16px;
            font-weight: bold;
            text-align: center;
            text-decoration: none;
        }

        .btn:active {
            opacity: 0.85;
        }

        .notice {
            background: #fdecea;
            border: 1px solid #c94a45;
            border-left: 6px solid #c94a45;
            border-radius: 8px;
            color: #8f1f1a;
            padding: 14px 16px;
            margin-bottom: 16px;
            font-size: 16px;
        }

        .notice strong {
            display: block;
            margin-bottom: 6px;
        }

        .steps {
            margin: 0 0 12px;
            padding-left: 1.3em;
        }

        .steps li {
            margin-bottom: 6px;
        }

        .hint {
            font-size: 14px;
            color: #5a6a85;
            margin: 10px 0 0;
        }

        .fallback-warn {
            color: #c94a45;
            margin-bottom: 10px;
        }
    </style>
</head>

<body>
    <div class="wrap" id="app"></div>

    <script>
        (function () {
            'use strict';

            // 固定のベースURL
            var BASE = 'https://wganko.github.io/DojoCalendar-LIFF/';

            var app = document.getElementById('app');

            // テキストを受け取り安全に要素を作るためのヘルパー
            function make(tag, options) {
                var node = document.createElement(tag);
                options = options || {};
                if (options.className) {
                    node.className = options.className;
                }
                if (options.text !== undefined) {
                    node.textContent = options.text;
                }
                if (options.href) {
                    node.setAttribute('href', options.href);
                }
                return node;
            }

            function add(parent, child) {
                parent.appendChild(child);
                return child;
            }

            // ?g= から組を決める。ro 以外（無し・不正値）はい組。
            function resolveGroup() {
                var g = '';
                try {
                    g = new URLSearchParams(window.location.search).get('g') || '';
                } catch (e) {
                    var m = /[?&]g=([^&#]*)/.exec(window.location.search);
                    g = m ? decodeURIComponent(m[1]) : '';
                }
                if (g === 'ro') {
                    return { name: 'ろ組', file: 'ro.ics', key: 'ro' };
                }
                return { name: 'い組', file: 'i.ics', key: 'i' };
            }

            // 共通パーツ：見出し・購読URL・ダウンロードリンク
            function renderBasics(card, group) {
                var icsUrl = BASE + group.file;

                add(card, make('h1', { text: '尺八道場（' + group.name + '） カレンダー登録' }));

                add(card, make('h2', { text: '購読URL' }));
                add(card, make('p', { className: 'url', text: icsUrl }));

                add(card, make('a', {
                    className: 'btn',
                    href: icsUrl,
                    text: '.icsファイルをダウンロード'
                }));

                return icsUrl;
            }

            // 正常時の描画
            function render() {
                var group = resolveGroup();
                var ua = navigator.userAgent || '';
                var isLine = / Line\//.test(ua);
                var isAndroid = /Android/i.test(ua);
                var isiOS = /iPhone|iPad|iPod/i.test(ua);
                var icsUrl = BASE + group.file;

                // LINE内ブラウザの注意喚起（最上部）
                if (isLine) {
                    var notice = make('div', { className: 'notice' });
                    add(notice, make('strong', { text: 'LINEのアプリ内ではカレンダー登録ができません。' }));
                    add(notice, make('span', {
                        text: '右上のメニュー（iPhone: 共有ボタン / Android: ︙）から「ブラウザで開く」を選んでください。'
                    }));
                    add(app, notice);
                }

                var card = make('div', { className: 'card' });
                add(app, card);
                renderBasics(card, group);

                // iPhone / iPad
                if (isiOS) {
                    add(card, make('a', {
                        className: 'btn',
                        href: 'webcal://wganko.github.io/DojoCalendar-LIFF/' + group.file,
                        text: 'カレンダーに追加'
                    }));
                    add(card, make('p', {
                        className: 'hint',
                        text: 'ボタンを押すとカレンダーアプリが開きます。'
                    }));
                }

                // Android
                if (isAndroid) {
                    add(card, make('a', {
                        className: 'btn',
                        href: 'https://calendar.google.com/calendar/r?cid=webcal://wganko.github.io/DojoCalendar-LIFF/' + group.file,
                        text: 'Googleカレンダーに追加'
                    }));
                    add(card, make('p', {
                        className: 'hint',
                        text: 'ボタンでGoogleカレンダーが開きます。うまく登録できない場合は、下の『.icsファイルをダウンロード』を保存するか、パソコンで『URLで追加』してください。'
                    }));
                }

                // PC（iOSでもAndroidでもない場合）
                if (!isiOS && !isAndroid) {
                    var pc = make('div', { className: 'card' });
                    add(app, pc);
                    add(pc, make('h2', { text: 'パソコンから登録する場合' }));
                    var ol = make('ol', { className: 'steps' });
                    add(ol, make('li', { text: 'Googleカレンダーをパソコンで開く' }));
                    add(ol, make('li', { text: '左の「他のカレンダー」の + をクリック' }));
                    add(ol, make('li', { text: '「URL で追加」を選ぶ' }));
                    add(ol, make('li', { text: '上のURLを貼り付けて「カレンダーを追加」' }));
                    add(pc, ol);
                    add(pc, make('p', { className: 'url', text: icsUrl }));
                }
            }

            // 失敗時のフォールバック：購読URLとダウンロードリンクだけは必ず表示
            function renderFallback() {
                var group = resolveGroup();
                var icsUrl = BASE + group.file;
                var card = make('div', { className: 'card' });
                add(app, card);
                add(card, make('h1', { text: '尺八道場（' + group.name + '） カレンダー登録' }));
                add(card, make('p', {
                    className: 'fallback-warn',
                    text: '一部の案内を表示できませんでした。下記のURLから登録してください。'
                }));
                add(card, make('h2', { text: '購読URL' }));
                add(card, make('p', { className: 'url', text: icsUrl }));
                add(card, make('a', {
                    className: 'btn',
                    href: icsUrl,
                    text: '.icsファイルをダウンロード'
                }));
            }

            try {
                render();
            } catch (e) {
                try {
                    app.textContent = '';
                    renderFallback();
                } catch (e2) {
                    app.textContent = 'エラーが発生しました。時間をおいて開き直してください。';
                }
            }
        })();
    </script>
</body>

</html>
