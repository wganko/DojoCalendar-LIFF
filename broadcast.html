<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>四国道場研修連絡</title>
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@700&family=Noto+Sans+JP:wght@400;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-top: #f8f2e7;
            --bg-bottom: #efe4d1;
            --panel: rgba(255, 251, 244, 0.98);
            --panel-border: rgba(190, 157, 73, 0.28);
            --gold: #c9a43b;
            --gold-strong: #b18a1f;
            --text: #2f2a22;
            --muted: #776b58;
            --field: #fffdf8;
            --success: #2f7a42;
            --error: #c94a45;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            margin: 0;
            min-height: 100dvh;
            background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
            color: var(--text);
            font-family: 'Noto Sans JP', sans-serif;
        }

        body {
            padding: 10px 8px 20px;
        }

        .container {
            width: calc(100vw - 16px);
            margin: 0 auto;
            padding: 18px;
            background: var(--panel);
            border: 1px solid var(--panel-border);
            border-radius: 18px;
            box-shadow: 0 14px 32px rgba(100, 79, 23, 0.12);
        }

        h1 {
            margin: 2px 0 22px;
            font-family: 'Noto Serif JP', serif;
            font-size: 30px;
            line-height: 1.2;
            text-align: center;
            color: var(--gold-strong);
        }

        .section-label {
            display: block;
            margin-bottom: 12px;
            font-size: 20px;
            font-weight: 700;
            color: var(--muted);
        }

        .target-selector {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 10px;
            margin-bottom: 24px;
        }

        .target-option input[type="radio"] {
            display: none;
        }

        .target-option label {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 60px;
            padding: 12px 8px;
            border: 2px solid rgba(190, 157, 73, 0.26);
            border-radius: 14px;
            background: rgba(201, 164, 59, 0.08);
            color: #6d7380;
            font-size: 18px;
            font-weight: 700;
            text-align: center;
            cursor: pointer;
        }

        .target-option input[type="radio"]:checked+label {
            border-color: var(--gold);
            background: rgba(201, 164, 59, 0.18);
            color: var(--gold-strong);
        }

        textarea {
            width: 100%;
            height: 210px;
            padding: 16px;
            border: 1px solid rgba(125, 104, 65, 0.18);
            border-radius: 14px;
            background: var(--field);
            color: var(--text);
            font-size: 18px;
            line-height: 1.55;
            resize: none;
        }

        textarea::placeholder {
            color: #9b907b;
        }

        .btn-container {
            margin-top: 24px;
        }

        .btn {
            width: 100%;
            min-height: 60px;
            border: none;
            border-radius: 14px;
            background: var(--gold);
            color: #fff;
            font-size: 22px;
            font-weight: 700;
            cursor: pointer;
        }

        .btn:disabled {
            background: #d9ceb1;
            color: #928975;
            cursor: default;
        }

        .status {
            margin-top: 16px;
            font-size: 16px;
            line-height: 1.5;
            text-align: left;
            white-space: pre-wrap;
        }

        .status.success {
            color: var(--success);
        }

        .status.error {
            color: var(--error);
        }

        .status.info {
            color: var(--muted);
        }

        iframe {
            display: none;
        }

        @media (min-width: 768px) {
            body {
                padding: 16px 12px 28px;
            }

            .container {
                max-width: 820px;
                padding: 28px;
                border-radius: 24px;
            }

            h1 {
                font-size: 38px;
            }

            .section-label {
                font-size: 24px;
            }

            .target-option label {
                min-height: 74px;
                font-size: 22px;
            }

            textarea {
                height: 260px;
                font-size: 22px;
                padding: 20px;
            }

            .btn {
                min-height: 72px;
                font-size: 26px;
            }

            .status {
                font-size: 20px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>四国道場研修連絡</h1>

        <span class="section-label">1. 配信先を選択</span>
        <div class="target-selector">
            <div class="target-option">
                <input type="radio" name="target-ui" id="target-all" value="all" checked>
                <label for="target-all">全員</label>
            </div>
            <div class="target-option">
                <input type="radio" name="target-ui" id="target-i" value="i">
                <label for="target-i">い組</label>
            </div>
            <div class="target-option">
                <input type="radio" name="target-ui" id="target-ro" value="ro">
                <label for="target-ro">ろ組</label>
            </div>
        </div>

        <span class="section-label">2. メッセージを入力</span>
        <textarea id="message" placeholder="こちらに伝えたい内容を入力してください..."></textarea>

        <div class="btn-container">
            <button class="btn" id="sendBtn">送信する</button>
        </div>

        <div class="status" id="status"></div>
    </div>

    <form id="broadcastForm" action="https://script.google.com/macros/s/AKfycbxWBE3d3p_LZUWOt_a1EbSJPqHq4XGidFshBOy8DYg/exec" method="post" target="hiddenTarget">
        <input type="hidden" name="action" value="broadcast">
        <input type="hidden" name="target" id="targetField" value="all">
        <input type="hidden" name="message" id="messageField" value="">
        <input type="hidden" name="userId" id="userIdField" value="">
    </form>
    <iframe name="hiddenTarget"></iframe>

    <script>
        const CONFIG = {
            // TODO: 一斉送信用に発行した LIFF ID へ置き換える
            LIFF_ID: 'SET_BROADCAST_LIFF_ID',
            SUPER_ADMINS: ['U80cae55bf31e8b90a6bb2aa9588ba1b7'],
            ADMINS: {
                i: ['U80cae55bf31e8b90a6bb2aa9588ba1b7'],
                ro: []
            }
        };

        const TARGET_MAP = {
            all: '全員',
            i: 'い組',
            ro: 'ろ組'
        };

        const state = {
            userId: '',
            lineName: ''
        };

        function showStatus(message, type) {
            const statusEl = document.getElementById('status');
            statusEl.textContent = message;
            statusEl.className = type ? `status ${type}` : 'status';
        }

        function isAdminForTarget(userId, target) {
            if (!userId) return false;
            if (CONFIG.SUPER_ADMINS.includes(userId)) return true;
            if (target === 'all') return false;
            return (CONFIG.ADMINS[target] || []).includes(userId);
        }

        async function initializeLiff() {
            try {
                document.getElementById('sendBtn').disabled = true;
                showStatus('管理者確認中...', 'info');

                if (!CONFIG.LIFF_ID || CONFIG.LIFF_ID === 'SET_BROADCAST_LIFF_ID') {
                    throw new Error('broadcast.html の LIFF_ID が未設定です。');
                }

                await liff.init({ liffId: CONFIG.LIFF_ID });

                if (!liff.isLoggedIn()) {
                    liff.login();
                    return;
                }

                const profile = await liff.getProfile();
                state.userId = profile.userId;
                state.lineName = profile.displayName;
                document.getElementById('userIdField').value = state.userId;
                document.getElementById('sendBtn').disabled = false;
                showStatus('', '');
            } catch (error) {
                document.getElementById('sendBtn').disabled = true;
                showStatus(`管理者確認に失敗しました: ${error.message || error}`, 'error');
            }
        }

        function submitBroadcast() {
            const target = document.querySelector('input[name="target-ui"]:checked').value;
            const message = document.getElementById('message').value.trim();

            if (!state.userId) {
                showStatus('管理者確認が完了していません。', 'error');
                return;
            }
            if (!isAdminForTarget(state.userId, target)) {
                showStatus('配信権限がありません。管理者アカウントで実行してください。', 'error');
                return;
            }
            if (!message) {
                showStatus('メッセージを入力してください。', 'error');
                return;
            }

            document.getElementById('targetField').value = target;
            document.getElementById('messageField').value = message;
            document.getElementById('sendBtn').disabled = true;
            showStatus(`送信中... ${TARGET_MAP[target]}へ配信します。`, 'info');
            document.getElementById('broadcastForm').submit();

            setTimeout(() => {
                document.getElementById('message').value = '';
                document.getElementById('sendBtn').disabled = false;
                showStatus(`送信しました。LINE側の【配信通知】を確認してください。`, 'success');
            }, 600);
        }

        document.getElementById('sendBtn').addEventListener('click', submitBroadcast);
        initializeLiff();
    </script>
</body>

</html>
